[project]
name = "quant-signal"
version = "0.1.0"
description = "美股半自动量化信号系统：只推信号，不自动下单"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "duckdb>=1.0,<2",
    "yfinance>=0.2.40,<0.3",
    "apscheduler>=3.10,<4",
    "structlog>=24.1,<25",
    "pandas-market-calendars>=4.4,<5",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
research = ["vectorbt>=0.26,<0.27"]

[dependency-groups]
dev = ["pytest>=8,<9", "mypy>=1.10,<2", "freezegun>=1.5,<2", "types-PyYAML"]

[project.scripts]
quant-signal = "quant_signal.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_signal"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
exclude = ["research/"]

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "pandas_market_calendars.*",
    "vectorbt.*",
    "apscheduler.*",
    "duckdb.*",
]
ignore_missing_imports = true
