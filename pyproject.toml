[project]
name = "quant-signal"
version = "0.1.0"
description = "美股半自动量化信号系统：只推信号，不自动下单"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "duckdb>=1.0,<2",
    "yfinance>=0.2.40,<0.3",
    "apscheduler>=3.10,<4",
    "structlog>=24.1,<25",
    "pandas-market-calendars>=4.4,<5",
    "httpx[socks]>=0.27,<1",
    "pyyaml>=6.0,<7",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "openpyxl>=3.1,<4",
    "lark-oapi>=1.7.1",
    "pillow>=12,<13",
]

[project.optional-dependencies]
# vectorbt 0.26 内部使用了新版 plotly 已移除的 'heatmapgl' 模板属性，锁定兼容旧版
research = ["vectorbt>=0.26,<0.27", "plotly<5.15"]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "mypy>=1.10,<2",
    "freezegun>=1.5,<2",
    "types-PyYAML",
    "pandas-stubs>=3.0.3.260530",
    "ruff>=0.12,<1",
    "pytest-cov>=6,<8",
    "pip-audit>=2.9,<3",
]

[project.scripts]
quant-signal = "quant_signal.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_signal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["quant_signal"]
branch = true

[tool.coverage.report]
fail_under = 70
skip_covered = true

[tool.mypy]
strict = true
exclude = ["research/"]

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "pandas_market_calendars.*",
    "vectorbt.*",
    "apscheduler.*",
    "duckdb.*",
    "lark_oapi.*",
]
ignore_missing_imports = true
