data_source: alpaca            # yfinance | alpaca（填好 .env 后改这里切换）
db_dir: data                   # duckdb/sqlite 存放目录，相对仓库根

universe:                      # momentum_rotation 标的池：原 ETF 候选池 + 用户实际持仓
  - SPY
  - QQQ
  - IWM
  - TLT
  - GLD
  - MU
  - DRAM
  - RAM
  - MRVL
  - SNDK
  - SNXX
  - SMH
  - QQQM
  - NVDA
  - AMD
  - LLY
  - INTC
  - TSM
  - 7709.HK
  - 000660.KS

international_tickers:          # 港股/韩股等固定走 yfinance（Alpaca 不支持），ticker -> 币种
  "7709.HK": HKD
  "000660.KS": KRW

watchlist:                     # breakout_20d 盘中观察列表
  - NVDA
  - TSLA
  - AAPL
  - MSFT
  - AMD

strategies:
  momentum_rotation:
    lookback_days: 60
    top_n: 3
    min_dollar_volume: 50000000    # 20日均成交额过滤（美元）
  breakout_20d:
    high_lookback_days: 20
    volume_multiplier: 1.5

notify:
  dedup_hours: 4
  hourly_limit: 10
