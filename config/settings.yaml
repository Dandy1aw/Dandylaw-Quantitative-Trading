data_source: alpaca            # yfinance | alpaca（填好 .env 后改这里切换）
db_dir: data                   # duckdb/sqlite 存放目录，相对仓库根

universe:                      # momentum_rotation 标的池：ETF候选 + Mag7 + 用户自选(去重)
  # --- ETF / 指数 ---
  - SPY
  - QQQ
  - QQQM
  - IWM
  - TLT
  - GLD
  - SMH
  - DRAM                          # Roundhill Memory ETF
  - RAM                           # 2x DRAM ETF
  - SNXX                          # 2x SNDK ETF
  - MUU                           # 2x MU ETF
  # --- Mag7 ---
  - AAPL
  - MSFT
  - GOOGL
  - AMZN
  - META
  - NVDA
  - TSLA
  # --- 半导体/科技个股 ---
  - MU
  - MRVL
  - SNDK
  - AMD
  - INTC
  - TSM
  - NBIS                          # Nebius
  - PLTR
  - NOW                           # ServiceNow
  - GLW                           # Corning 康宁
  - LLY
  - JNJ
  # --- 港股/韩股 ---
  - 7709.HK
  - 000660.KS

international_tickers:          # 港股/韩股等固定走 yfinance（Alpaca 不支持），ticker -> 币种
  "7709.HK": HKD
  "000660.KS": KRW

trend_gate:                      # 趋势持有闸门+防御切换（阶段B回测选出的最优配置：仅200线+防御）
  enabled: true                  # 动量选出后叠加，趋势失效切防御sleeve；回测降回撤44.5%->29.5%
  ma_days: 200
  buffer: 0.03                   # 200日线缓冲带
  use_mom: false                 # 回测显示加绝对动量/相对强弱反而过度保守，关闭
  benchmark: SPY                 # 个股相对强弱基准（use_mom=true时才用）
  defensive: [BIL, TLT, GLD]     # 防御sleeve候选，按绝对动量选最强；BIL即现金地板

momentum_group_top_n:            # 动量轮动按币种分组独立排名的名额，不配置的币种(含美股)归入默认组用 top_n
  HKD: 1                          # 港股组名额
  KRW: 1                          # 韩股组名额

momentum_default_group_top_n:    # 美股默认组内部再按资产类型独立排名的名额
  ETF: 2
  STOCK: 3

asset_type:                      # ticker -> ETF|STOCK，仅用于美股默认组内部再分名额
  SPY: ETF
  QQQ: ETF
  QQQM: ETF
  IWM: ETF
  TLT: ETF
  GLD: ETF
  SMH: ETF
  DRAM: ETF
  RAM: ETF
  SNXX: ETF                        # Tradr 2X Long SNDK Daily ETF，虽跟踪个股但本身是ETF产品
  MUU: ETF                         # 2X Long MU ETF
  AAPL: STOCK
  MSFT: STOCK
  GOOGL: STOCK
  AMZN: STOCK
  META: STOCK
  NVDA: STOCK
  TSLA: STOCK
  MU: STOCK
  MRVL: STOCK
  SNDK: STOCK
  AMD: STOCK
  INTC: STOCK
  TSM: STOCK
  NBIS: STOCK
  PLTR: STOCK
  NOW: STOCK
  GLW: STOCK
  LLY: STOCK
  JNJ: STOCK

watchlist:                     # breakout_20d 盘中观察列表
  - NVDA
  - TSLA
  - AAPL
  - MSFT
  - AMD

strategies:
  momentum_rotation:
    lookback_days: 60
    top_n: 3
    min_dollar_volume: 50000000    # 20日均成交额过滤（美元）
  breakout_20d:
    high_lookback_days: 20
    volume_multiplier: 1.5
  price_deviation:
    threshold: 0.02                # 持仓/今日BUY目标相对当天参考价涨跌超此比例即提醒
  rsi_reversion:
    period: 14
    oversold: 30
    overbought: 70
  macd_cross:
    fast: 12
    slow: 26
    signal: 9
  bollinger_breakout:
    period: 20
    num_std: 2.0

notify:
  dedup_hours: 4
  hourly_limit: 10

enrichment:                      # UZI-Skill 深度分析信息增强（盘前 08:45 ET 跑一次）
  enabled: true
  uzi_run_py: "C:/Users/syw/.claude/plugins/cache/uzi-skill/stock-deep-analyzer/3.9.1/skills/deep-analysis/run.py"
  python_exe: "python"
  depth: lite
  timeout_seconds: 120
  max_tickers: 8
