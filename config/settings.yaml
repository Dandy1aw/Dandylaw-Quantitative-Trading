data_source: alpaca            # yfinance | alpaca（填好 .env 后改这里切换）
db_dir: data                   # duckdb/sqlite 存放目录，相对仓库根

universe:                      # momentum_rotation 标的池：原 ETF 候选池 + 用户实际持仓
  - SPY
  - QQQ
  - IWM
  - TLT
  - GLD
  - MU
  - DRAM
  - RAM
  - MRVL
  - SNDK
  - SNXX
  - SMH
  - QQQM
  - NVDA
  - AMD
  - LLY
  - INTC
  - TSM
  - 7709.HK
  - 000660.KS

international_tickers:          # 港股/韩股等固定走 yfinance（Alpaca 不支持），ticker -> 币种
  "7709.HK": HKD
  "000660.KS": KRW

momentum_group_top_n:            # 动量轮动按币种分组独立排名的名额，不配置的币种(含美股)归入默认组用 top_n
  HKD: 1                          # 港股组名额
  KRW: 1                          # 韩股组名额

watchlist:                     # breakout_20d 盘中观察列表
  - NVDA
  - TSLA
  - AAPL
  - MSFT
  - AMD

strategies:
  momentum_rotation:
    lookback_days: 60
    top_n: 3
    min_dollar_volume: 50000000    # 20日均成交额过滤（美元）
  breakout_20d:
    high_lookback_days: 20
    volume_multiplier: 1.5
  price_deviation:
    threshold: 0.02                # 持仓/今日BUY目标相对当天参考价涨跌超此比例即提醒
  rsi_reversion:
    period: 14
    oversold: 30
    overbought: 70
  macd_cross:
    fast: 12
    slow: 26
    signal: 9
  bollinger_breakout:
    period: 20
    num_std: 2.0

notify:
  dedup_hours: 4
  hourly_limit: 10

enrichment:                      # UZI-Skill 深度分析信息增强（可选，默认关闭）
  enabled: false
  uzi_run_py: "C:/Users/syw/.claude/plugins/cache/uzi-skill/stock-deep-analyzer/3.9.1/skills/deep-analysis/run.py"
  python_exe: "python"
  depth: lite
  timeout_seconds: 120
  max_tickers: 8
