data_source: alpaca            # yfinance | alpaca（填好 .env 后改这里切换）
db_dir: data                   # duckdb/sqlite 存放目录，相对仓库根

tickers:                       # 标的注册表：动量池、资产类型、计价币种的单一来源
  SPY: {asset_type: ETF, currency: USD}
  QQQ: {asset_type: ETF, currency: USD}
  QQQM: {asset_type: ETF, currency: USD}
  IWM: {asset_type: ETF, currency: USD}
  TLT: {asset_type: ETF, currency: USD}
  GLD: {asset_type: ETF, currency: USD}
  SMH: {asset_type: ETF, currency: USD}
  DRAM: {asset_type: ETF, currency: USD}
  RAM: {asset_type: ETF, currency: USD, leverage: 2}    # 2x DRAM
  SNXX: {asset_type: ETF, currency: USD, leverage: 2}   # 2x SNDK
  MUU: {asset_type: ETF, currency: USD, leverage: 2}    # 2x MU
  AAPL: {asset_type: STOCK, currency: USD}
  MSFT: {asset_type: STOCK, currency: USD}
  GOOGL: {asset_type: STOCK, currency: USD}
  AMZN: {asset_type: STOCK, currency: USD}
  META: {asset_type: STOCK, currency: USD}
  NVDA: {asset_type: STOCK, currency: USD}
  TSLA: {asset_type: STOCK, currency: USD}
  MU: {asset_type: STOCK, currency: USD}
  MRVL: {asset_type: STOCK, currency: USD}
  SNDK: {asset_type: STOCK, currency: USD}
  AMD: {asset_type: STOCK, currency: USD}
  INTC: {asset_type: STOCK, currency: USD}
  TSM: {asset_type: STOCK, currency: USD}
  NBIS: {asset_type: STOCK, currency: USD}
  PLTR: {asset_type: STOCK, currency: USD}
  NOW: {asset_type: STOCK, currency: USD}
  GLW: {asset_type: STOCK, currency: USD}
  LLY: {asset_type: STOCK, currency: USD}
  JNJ: {asset_type: STOCK, currency: USD}
  "7709.HK": {asset_type: STOCK, currency: HKD}
  SKHY: {asset_type: STOCK, currency: USD}

trend_gate:                      # 趋势持有闸门+防御切换（阶段B回测选出的最优配置：仅200线+防御）
  enabled: true                  # 动量选出后叠加，趋势失效切防御sleeve；回测降回撤44.5%->29.5%
  ma_days: 200
  buffer: 0.03                   # 200日线缓冲带
  use_mom: false                 # 回测显示加绝对动量/相对强弱反而过度保守，关闭
  benchmark: SPY                 # 个股相对强弱基准（use_mom=true时才用）
  defensive: [BIL, TLT, GLD]     # 防御sleeve候选，按绝对动量选最强；BIL即现金地板

momentum_group_top_n:            # 动量轮动按币种分组独立排名的名额，不配置的币种(含美股)归入默认组用 top_n
  HKD: 1                          # 港股组名额

momentum_default_group_top_n:    # 美股默认组内部再按资产类型独立排名的名额
  ETF: 2
  STOCK: 3

watchlist:                     # breakout_20d 盘中观察列表
  - NVDA
  - TSLA
  - AAPL
  - MSFT
  - AMD

strategies:
  momentum_rotation:
    lookback_days: 60
    top_n: 3
    min_dollar_volume: 50000000    # 20日均成交额过滤（美元）
  breakout_20d:
    high_lookback_days: 20
    volume_multiplier: 1.5
  price_deviation:
    threshold: 0.02                # 持仓/今日BUY目标相对当天参考价涨跌超此比例即提醒
  rsi_reversion:
    period: 14
    oversold: 30
    overbought: 70
  macd_cross:
    fast: 12
    slow: 26
    signal: 9
  bollinger_breakout:
    period: 20
    num_std: 2.0

notify:
  dedup_hours: 4
  action_card_only: false
  premarket_hourly_limit: 10
  intraday_hourly_limit: 10
  deviation_hourly_limit: 10

enrichment:                      # UZI-Skill 深度分析信息增强（盘前 08:45 ET 跑一次）
  enabled: true
  uzi_run_py: "C:/Users/syw/.claude/plugins/cache/uzi-skill/stock-deep-analyzer/3.9.1/skills/deep-analysis/run.py"
  python_exe: "python"
  depth: lite
  timeout_seconds: 60
  max_tickers: 8

ai_briefing:                     # 盘前早报后调用 AI CLI 输出观点卡；失败/超时不影响原早报
  enabled: true
  provider: codex_cli             # claude_code_cli | codex_cli
  command: codex                  # provider=claude_code_cli 时改为 claude
  timeout_seconds: 90
  max_chars: 6000

index_universe:
  enabled: true
  indices: [sp500, nasdaq100]
  cache_path: data/index_universe.json
  refresh_days: 7
  max_stale_days: 14
  scan_top_n: 20
  execution_top_n: 5
  min_coverage: 0.98
  min_dollar_volume: 50000000

us_briefing:
  enabled: true                   # 独立分支先影子运行；delivery_mode=shadow 不发送生产卡片
  delivery_mode: shadow           # shadow 只计算/落库，不替换生产推送
  candidate_index: nasdaq100
  min_coverage: 0.98
  morning_hour_utc: 0             # 北京 08:00
  morning_minute_utc: 0
  afternoon_hour_utc: 7           # 北京 15:30
  afternoon_minute_utc: 30
  market_regime:
    benchmark: QQQ
    min_history_days: 201
    trend_breadth_min: 0.60
    risk_off_breadth_max: 0.35
    high_volatility_annualized: 0.35
  candidate_lanes:
    top_n_per_lane: 3
    minimum_price: 5
    min_dollar_volume: 50000000
    overheat_atr_multiple: 2.5
    pullback_atr_multiple: 1.25
    stop_atr_multiple: 2.0
    target_reward_risk: 2.0
  position_discipline:
    hard_loss_caps: {"1x": 0.08, "2x": 0.05, "3x": 0.035}
    breakeven_trigger: 0.10
    stage_one_profit_lock: 0.02
    stage_two_profit_lock: 0.08
    allow_financing_for_leveraged: false

execution_plan:
  enabled: true
  account_provider: screenshot
  capital_limit_usd: 6000
  max_financing_ratio: 0.20
  screenshot_max_age_hours: 72
  risk_per_trade: 0.005
  max_daily_new_risk: 0.01
  max_position_weight: 0.12
  max_cluster_weight: 0.35
  cash_reserve: 0.0
  risk_clusters:
    semiconductor_memory: [DRAM, MU, RAM, SMH, SNXX, MUU, SNDK, AMD, NVDA, INTC, TSM, MRVL]
  max_new_positions_per_day: 2
  min_stop_distance: 0.02
  max_stop_distance: 0.20
  quote_max_age_seconds: 420
  account_max_age_seconds: 60

option_flow:
  enabled: true
  feed: indicative
  top_n: 10
  discovery_limit: 50
  venues: [cone, ctwo, opt, exo]
  excluded_index_roots: [SPX, SPXW, VIX, RUT, RUTW, NDX, XSP, OEX]
  etf_roots: [SPY, QQQ, IWM, TQQQ, SQQQ, SOXL, SOXS, TLT, GLD, HYG, XLF]
  min_volume: 5000
  surge_volume: 10000
  zero_dte_surge_volume: 20000
  rank_jump: 3
  cooldown_minutes: 60
  max_alerts_per_day: 4
  intraday_expiry_minutes: 45
  closing_expiry_hours: 12
  retention_days: 120
  min_venue_coverage: 1.0
  display_dedupe_underlying: true   # 每侧同标的只显示最高量合约
  display_sort_by_expiry: true      # 展示按到期日升序(近月优先)

option_intel:                     # 持仓期权情报(只观察, 不推荐任何期权交易)
  enabled: true
  max_expiry_days: 60             # 只看 60 天内到期的合约
  min_expected_move_dte: 7        # 预期波动取 DTE>=7 的最近到期
  top_oi_strikes: 3               # 展示 OI 最大的 N 个 strike
  iv_rv_warn_ratio: 1.5           # ATM IV / 20日RV 超过此值提示"事件定价"
  retention_days: 400             # 日度快照保留天数(留足一年做分位数)
  max_tickers: 12                 # 每日最多处理的持仓标的数

feishu_bot:                       # 自建应用机器人交互(需 FEISHU_APP_ID/SECRET)
  enabled: true
  allowed_open_ids: [ou_3953033b90bfd9b808b9309c668bb77c]
  push_receive_id: oc_f4622ab1b7ccab85b854b88c7f225689  # 全部推送发到群；清空则回退 webhook
  capital_limit: 6000
  max_financing_ratio: 0.20
  confirm_window_minutes: 15
  codex_timeout_seconds: 180

legacy_price_deviation:
  enabled: false
