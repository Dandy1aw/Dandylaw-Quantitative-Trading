name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Enforce secret policy
        run: uv run python scripts/check_secrets.py
      - name: Enforce release policy
        run: uv run python scripts/check_release_state.py
      - name: Lint critical Python errors
        run: uv run ruff check src tests scripts --select E9,F63,F7,F82
      - name: Audit dependencies
        env:
          PYTHONUTF8: "1"
        run: uv run pip-audit
      - name: Run tests
        run: uv run pytest -q --cov --cov-report=term-missing
      - name: Type check
        run: uv run mypy src
      - name: Check patch whitespace
        run: git diff --check HEAD
